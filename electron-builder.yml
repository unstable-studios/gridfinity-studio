appId: com.unstablestudios.gridfinity-studio
# The name people see. File names, the install folder and the data folder come from `name`
# in package.json, so they stay `gridfinity-studio`.
productName: Gridfinity Studio
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # The app runs from `out/`, `resources/`, `node_modules/` and `package.json`. Nothing else
  # in the repo belongs in an installer: planning notes, tests, docs and tool settings.
  - '!{docs,specs,e2e,scripts,.specify,.claude,.github,.husky}/**'
  - '!{CLAUDE.md,CONTRIBUTING.md,components.json,renovate.json,pnpm-workspace.yaml}'
  - '!{playwright.config.ts,vitest.config.mts,vite.config.ts,commitlint.config.mjs}'
  - '!{.actrc,.nvmrc,.editorconfig,.release-please-config.json,.release-please-manifest.json}'
asarUnpack:
  - resources/**
win:
  executableName: gridfinity-studio
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  # The zip the updater downloads. Its default name starts with productName.
  artifactName: ${name}-${version}-${arch}-mac.${ext}
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  # Notarize on CI when APPLE_TEAM_ID + APPLE_API_KEY* env vars are present.
  # If they're missing (e.g. local dev build), electron-builder skips signing
  # entirely and notarize is a no-op — so this stays compatible with unsigned
  # local builds.
  notarize: true
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: Unstable Studios <info@unstablestudios.com>
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: unstable-studios
  repo: gridfinity-studio
