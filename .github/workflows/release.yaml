name: Build and Release

on:
  workflow_run:
    workflows: ["Release Please"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  build-matrix:
    # Only run if release-please was successful and created a release
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.name == 'Release Please'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get latest release tag
        id: release_tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Latest release tag: $TAG"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Create app package
        run: pnpm package
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload to release (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ steps.release_tag.outputs.tag }} \
            release/*.AppImage \
            release/*.deb \
            release/*.snap \
            release/*.yml \
            release/*.blockmap* \
            --clobber

      - name: Upload to release (macOS)
        if: matrix.os == 'macos-latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ steps.release_tag.outputs.tag }} \
            release/*.dmg \
            release/*.zip \
            release/*.yml \
            release/*.blockmap* \
            --clobber

      - name: Upload to release (Windows)
        if: matrix.os == 'windows-latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ steps.release_tag.outputs.tag }} \
            release/*.exe \
            release/*.msi \
            release/*.zip \
            release/*.yml \
            release/*.blockmap* \
            --clobber
