name: Lint Workflows

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/scripts/**'

jobs:
  actionlint:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - name: Run actionlint
        uses: rhysd/actionlint@v1.7.12

      - name: Check the workflow scripts
        run: shellcheck .github/scripts/*.sh
