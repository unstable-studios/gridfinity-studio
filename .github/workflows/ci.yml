name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  # Lightweight gate for release PRs — skip full CI
  release-check:
    if: startsWith(github.head_ref, 'release-please') || github.actor == 'release-please[bot]'
    uses: unstable-studios/.github/.github/workflows/release-pr-check.yml@main

  # Commitlint
  commitlint:
    name: Commitlint
    if: "!startsWith(github.head_ref || '', 'release-please') && github.actor != 'release-please[bot]'"
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate commit messages
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"
          else
            pnpm exec commitlint --from "${{ github.event.before }}" --to "${{ github.sha }}"
          fi

  # Lint, typecheck, build run in parallel
  lint:
    name: Lint
    if: "!startsWith(github.head_ref || '', 'release-please') && github.actor != 'release-please[bot]'"
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm lint

  typecheck:
    name: Type Check
    if: "!startsWith(github.head_ref || '', 'release-please') && github.actor != 'release-please[bot]'"
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm typecheck

  build:
    name: Build
    if: "!startsWith(github.head_ref || '', 'release-please') && github.actor != 'release-please[bot]'"
    needs: [commitlint, typecheck, lint]
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm build
      - name: Validate build output
        run: |
          test -d out/main && echo "✓ Main process built"
          test -d out/preload && echo "✓ Preload scripts built"
          test -d out/renderer && echo "✓ Renderer built"
