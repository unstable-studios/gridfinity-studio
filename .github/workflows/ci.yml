name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  # Lightweight gate for release PRs — skip full CI
  release-check:
    if: startsWith(github.head_ref, 'release-please') || github.actor == 'release-please[bot]'
    uses: unstable-studios/.github/.github/workflows/release-pr-check.yml@main

  # A release PR may change only the version, the changelog and the manifest. Its commit is
  # written from copies of the files taken earlier, and a stale copy undoes what merged since.
  release-guard:
    name: Release changes only the version
    if: startsWith(github.head_ref || '', 'release-please')
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Compare with the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --quiet origin "$BASE_REF"
          .github/scripts/release-guard.sh "origin/$BASE_REF" HEAD

  # Commitlint
  commitlint:
    name: Commitlint
    if: "!startsWith(github.head_ref || '', 'release-please') && github.actor != 'release-please[bot]'"
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://npm.pkg.github.com
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate commit messages
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"
          else
            pnpm exec commitlint --from "${{ github.event.before }}" --to "${{ github.sha }}"
          fi

  # Lint, typecheck, test, e2e run in parallel; build runs after them
  lint:
    name: Lint
    if: "!startsWith(github.head_ref || '', 'release-please') && github.actor != 'release-please[bot]'"
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://npm.pkg.github.com
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm lint

  typecheck:
    name: Type Check
    if: "!startsWith(github.head_ref || '', 'release-please') && github.actor != 'release-please[bot]'"
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://npm.pkg.github.com
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm typecheck

  test:
    name: Test
    if: "!startsWith(github.head_ref || '', 'release-please') && github.actor != 'release-please[bot]'"
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://npm.pkg.github.com
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm test

  e2e:
    name: End-to-end
    if: "!startsWith(github.head_ref || '', 'release-please') && github.actor != 'release-please[bot]'"
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://npm.pkg.github.com
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's
      # sandbox needs; allow them for this job.
      # Electron 42 fetches its binary on first use; do it here so a slow
      # download does not count against a test's timeout.
      - name: Download Electron
        run: pnpm exec node node_modules/electron/install.js
      - name: Allow Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Run smoke suite
        run: xvfb-run --auto-servernum pnpm test:e2e
      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: e2e/.results
          include-hidden-files: true
          retention-days: 7

  build:
    name: Build
    if: "!startsWith(github.head_ref || '', 'release-please') && github.actor != 'release-please[bot]'"
    needs: [commitlint, typecheck, lint, test, e2e]
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://npm.pkg.github.com
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm build
      - name: Validate build output
        run: |
          test -d out/main && echo "✓ Main process built"
          test -d out/preload && echo "✓ Preload scripts built"
          test -d out/renderer && echo "✓ Renderer built"
