name: Build for Release

on:
  release:
    types: [created]

permissions:
  contents: write
  packages: read

concurrency:
  group: release-build-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  # Release Please is told to leave the Latest mark on the release before a new one
  # (`mark-latest: false` in release-please.yml), since the app's updater only looks at the
  # Latest release and a new one has no installers yet. That can fail to happen: it is one
  # step in another workflow. This is the backstop. It goes by what a release holds, not by
  # what was Latest, so it also puts things right after a release whose build failed.
  hold:
    name: Keep the last complete release as Latest
    runs-on: ubuntu-latest
    # A help, not a gate: if this fails, the installers must still be built and attached.
    continue-on-error: true
    steps:
      - name: Mark the last release with installers as Latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        # Named, so a failed request fails the step instead of reading as "no release".
        shell: bash
        run: |
          # Newest first. `latest.yml` is the Windows update file, attached with the rest.
          previous=$(gh api "repos/$REPO/releases?per_page=30" | jq -r --arg tag "$TAG" '
            [.[]
              | select(.draft | not)
              | select(.prerelease | not)
              | select(.tag_name != $tag)
              | select(any(.assets[]; .name == "latest.yml"))
            ][0].tag_name // empty')
          if [ -z "$previous" ]; then
            echo "No earlier release with installers. $TAG stays Latest."
            exit 0
          fi
          echo "Keeping $previous as Latest while $TAG builds."
          gh release edit "$previous" --repo "$REPO" --latest

  build:
    name: Build installers
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://npm.pkg.github.com
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # build:mac/win/linux in package.json chain `electron-vite build &&
      # electron-builder ...`. pnpm cannot forward CLI flags through that
      # chain — they get dropped — so we invoke the two commands directly.
      # GH_TOKEN is set so electron-builder's tag-context "implicit publish"
      # path doesn't crash on a missing token even though we pass --publish=never.
      - name: Compile renderer + main
        run: pnpm electron-vite build

      # Decode the App Store Connect API key (.p8) to a file so electron-builder
      # can point notarytool at it via APPLE_API_KEY. Stored as a base64 secret
      # to survive newlines in the PEM-formatted key.
      - name: Write Apple API key
        if: matrix.os == 'macos-latest' && env.APPLE_API_KEY_BASE64 != ''
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/apple"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/apple/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/apple/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/apple/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Package macOS
        if: matrix.os == 'macos-latest'
        run: pnpm electron-builder --mac --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing — electron-builder imports CSC_LINK (.p12) into a temp
          # keychain on the runner. If unset (no signing secrets configured),
          # electron-builder produces an unsigned build instead of failing.
          CSC_LINK: ${{ secrets.MAC_CERTS_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          # Notarization (App Store Connect API key — preferred over Apple ID +
          # app-specific password since it doesn't require MFA). APPLE_API_KEY
          # is exported in the previous step.
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Package Windows
        if: matrix.os == 'windows-latest'
        run: pnpm electron-builder --win --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Linux
        if: matrix.os == 'ubuntu-latest'
        run: pnpm electron-builder --linux --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Only upload installer outputs — exclude dist/win-unpacked, dist/mac-arm64,
      # etc., so the publish step's globs don't accidentally match unpacked
      # binaries. if-no-files-found: warn because each runner only produces
      # the artifacts for its own platform.
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/*-mac.zip
            dist/*.zip.blockmap
            dist/*-setup.exe
            dist/*-setup.exe.blockmap
            dist/*.AppImage
            dist/*.deb
            dist/*.snap
            dist/latest*.yml
          if-no-files-found: warn
          retention-days: 7

  publish:
    name: Publish release artifacts
    runs-on: ubuntu-latest
    needs: [hold, build]
    steps:
      # upload-artifact strips the leading `dist/` prefix when path uses a
      # wildcard, so artifact contents are flat. With merge-multiple the
      # download lands files directly in the workflow workspace — patterns
      # below match files in cwd, not under dist/.
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        with:
          files: |
            *-setup.exe
            *-setup.exe.blockmap
            *.dmg
            *.dmg.blockmap
            *-mac.zip
            *.zip.blockmap
            *.AppImage
            *.deb
            *.snap
            latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Only now does this release have what an update needs. See the `hold` job. The mark
      # goes to the newest release that has installers, which is this one unless a newer
      # release finished first or this is a re-run for an old tag: it never moves backwards.
      # If a build fails, the mark stays where it was and nobody is offered an empty release.
      - name: Mark the newest complete release as Latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          newest=$(gh api "repos/$REPO/releases?per_page=30" | jq -r '
            [.[]
              | select(.draft | not)
              | select(.prerelease | not)
              | select(any(.assets[]; .name == "latest.yml"))
            ][0].tag_name // empty')
          if [ -z "$newest" ]; then
            echo "::error::No release has installers attached."
            exit 1
          fi
          echo "Marking $newest as Latest."
          gh release edit "$newest" --repo "$REPO" --latest
