name: Build for Release

on:
  release:
    types: [created]

permissions:
  contents: write
  packages: read

concurrency:
  group: release-build-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"

jobs:
  build:
    name: Build installers
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://npm.pkg.github.com
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build macOS
        if: matrix.os == 'macos-latest'
        run: pnpm run build:mac -- --publish=never

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: pnpm run build:win -- --publish=never

      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run build:linux -- --publish=never

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: dist/**
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release artifacts
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/dist/gridfinity-studio-*-setup.exe
            **/dist/gridfinity-studio-*.dmg
            **/dist/gridfinity-studio-*.AppImage
            **/dist/*.deb
            **/dist/*.snap
            **/dist/latest*.yml
            **/dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
