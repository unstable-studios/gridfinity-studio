name: Build for Release

on:
  release:
    types: [created]

permissions:
  contents: write
  packages: read

concurrency:
  group: release-build-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  build:
    name: Build installers
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://npm.pkg.github.com
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # build:mac/win/linux in package.json chain `electron-vite build &&
      # electron-builder ...`. pnpm cannot forward CLI flags through that
      # chain — they get dropped — so we invoke the two commands directly.
      # GH_TOKEN is set so electron-builder's tag-context "implicit publish"
      # path doesn't crash on a missing token even though we pass --publish=never.
      - name: Compile renderer + main
        run: pnpm electron-vite build

      - name: Package macOS
        if: matrix.os == 'macos-latest'
        run: pnpm electron-builder --mac --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Windows
        if: matrix.os == 'windows-latest'
        run: pnpm electron-builder --win --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Linux
        if: matrix.os == 'ubuntu-latest'
        run: pnpm electron-builder --linux --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Only upload installer outputs — exclude dist/win-unpacked, dist/mac-arm64,
      # etc., so the publish step's globs don't accidentally match unpacked
      # binaries. if-no-files-found: warn because each runner only produces
      # the artifacts for its own platform.
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/*.zip.blockmap
            dist/*-setup.exe
            dist/*-setup.exe.blockmap
            dist/*.AppImage
            dist/*.deb
            dist/*.snap
            dist/latest*.yml
          if-no-files-found: warn
          retention-days: 7

  publish:
    name: Publish release artifacts
    runs-on: ubuntu-latest
    needs: build
    steps:
      # upload-artifact strips the leading `dist/` prefix when path uses a
      # wildcard, so artifact contents are flat. With merge-multiple the
      # download lands files directly in the workflow workspace — patterns
      # below match files in cwd, not under dist/.
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *-setup.exe
            *-setup.exe.blockmap
            *.dmg
            *.dmg.blockmap
            *.zip.blockmap
            *.AppImage
            *.deb
            *.snap
            latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
