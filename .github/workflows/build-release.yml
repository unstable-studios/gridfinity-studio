name: Build for Release

on:
  release:
    types: [created]

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: release-build-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24

jobs:
  build:
    name: Build installers
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS
        if: matrix.os == 'macos-latest'
        run: pnpm run build:mac -- --publish=never

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: pnpm run build:win -- --publish=never

      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run build:linux -- --publish=never

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/**
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release assets
    if: github.event.release.draft == true
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true

      - name: Upload installers to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s globstar nullglob
          files=(
            **/dist/gridfinity-studio-*-setup.exe
            **/dist/gridfinity-studio-*.dmg
            **/dist/gridfinity-studio-*.AppImage
            **/dist/*.deb
            **/dist/*.snap
            **/dist/latest*.yml
            **/dist/*.blockmap
          )

          ((${#files[@]})) || { echo "No release artifacts found"; exit 1; }
          gh release upload "${{ github.event.release.tag_name }}" "${files[@]}" --clobber

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.event.release.tag_name }}" --draft=false
