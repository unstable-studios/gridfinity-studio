name: Release Please

on:
  push:
    branches:
      - main
    paths-ignore:
      - "pnpm-lock.yaml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      pr_number: ${{ steps.release.outputs.pr }}
      pr_branch: ${{ steps.release.outputs.pr-branch }}
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GH_PAT_RELEASEPLEASE }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  update-lockfile:
    name: Update pnpm Lockfile
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.pr_number
    steps:
      - name: Checkout release PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT_RELEASEPLEASE }}
          ref: ${{ needs.release-please.outputs.pr_branch }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Update pnpm lockfile
        run: pnpm install --lockfile-only

      - name: Commit lockfile update
        run: |
          git status --porcelain
          if git diff --quiet; then
            echo "No lockfile changes"
            exit 0
          fi
          git config user.email "release-please[bot]@users.noreply.github.com"
          git config user.name "release-please[bot]"
          git add pnpm-lock.yaml
          git commit -m "chore: update pnpm-lock.yaml for release-please"
          git push origin HEAD:${{ needs.release-please.outputs.pr_branch }}
