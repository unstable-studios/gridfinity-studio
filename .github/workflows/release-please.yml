name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    uses: unstable-studios/.github/.github/workflows/release-please.yml@main
    with:
      config-file: .release-please-config.json
      manifest-file: .release-please-manifest.json
    secrets: inherit
