name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    uses: unstable-studios/.github/.github/workflows/release-please.yml@main
    with:
      config-file: .release-please-config.json
      manifest-file: .release-please-manifest.json
      # A new release has no installers for the first few minutes. The release before it
      # stays Latest, which is what the app's updater reads, until build-release.yml has
      # attached them and moves the mark.
      mark-latest: false
    secrets: inherit
